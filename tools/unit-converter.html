<body data-tool-color="teal" data-tool-name="Unit Converter">
  <a href="#main" class="skip-link" data-i18n="common.skipToContent">Skip to content</a>

  <header class="site-header"></header>

  <main id="main" class="site-main">
    <div class="tool-page">
      <h1 class="tool-title" data-i18n="tool.unitConverter.heading">Unit Converter</h1>
      <p class="tool-description" data-i18n="tool.unitConverter.description">Convert length, weight, temperature, volume, area, speed and digital data in real time.</p>

      <div class="tool-card-container">
        <!-- Category Select -->
        <div class="form-group">
          <label class="form-label" for="uc-category" data-i18n="tool.unitConverter.categoryLabel">Category</label>
          <select id="uc-category" class="form-select">
            <option value="length" data-i18n="tool.unitConverter.catLength">Length</option>
            <option value="weight" data-i18n="tool.unitConverter.catWeight">Weight</option>
            <option value="temperature" data-i18n="tool.unitConverter.catTemperature">Temperature</option>
            <option value="volume" data-i18n="tool.unitConverter.catVolume">Volume</option>
            <option value="area" data-i18n="tool.unitConverter.catArea">Area</option>
            <option value="speed" data-i18n="tool.unitConverter.catSpeed">Speed</option>
            <option value="data" data-i18n="tool.unitConverter.catData">Digital Data</option>
          </select>
        </div>

        <!-- Input Row -->
        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="uc-input-value" data-i18n="tool.unitConverter.valueLabel">Value</label>
            <input type="text" id="uc-input-value" class="form-input" inputmode="decimal" placeholder="0" autocomplete="off">
          </div>
          <div class="form-group">
            <label class="form-label" for="uc-from" data-i18n="tool.unitConverter.fromLabel">From</label>
            <select id="uc-from" class="form-select"></select>
          </div>
        </div>

        <!-- Swap -->
        <div class="tool-actions tool-actions-center">
          <button type="button" class="btn-swap" id="uc-swap" data-i18n-aria="tool.unitConverter.swapAria" aria-label="Swap units">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 16V4m0 0L3 8m4-4l4 4M17 8v12m0 0l4-4m-4 4l-4-4"/></svg>
          </button>
        </div>

        <!-- Output Row -->
        <div class="form-row">
          <div class="form-group">
            <label class="form-label" id="uc-output-label" data-i18n="tool.unitConverter.resultLabel">Result</label>
            <div class="tool-output tool-output-lg tool-output-copyable" id="uc-output-value" role="status" aria-live="polite" aria-labelledby="uc-output-label" tabindex="0" data-i18n-aria="tool.unitConverter.resultAria" aria-label="Click to copy result">
              <span class="tool-output-empty" data-i18n="tool.unitConverter.enterValue">Enter a value</span>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label" for="uc-to" data-i18n="tool.unitConverter.toLabel">To</label>
            <select id="uc-to" class="form-select"></select>
          </div>
        </div>
      </div>

      <p class="tool-disclaimer" data-i18n="tool.unitConverter.disclaimer">Conversions are calculated locally in the browser with up to 10 decimal digits of precision.</p>

      <a href="/" class="tool-back-home">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
        <span data-i18n="common.backToHome">Back to Home</span>
      </a>
    </div>
